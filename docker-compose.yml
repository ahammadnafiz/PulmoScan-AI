services:
  api:
    build: .
    image: pulmoscan-ai:latest
    container_name: pulmoscan-api
    ports:
      - "8000:8000"
    environment:
      ENV: production
      USE_TTA: "true"
      WORKERS: "1"                       # 1 worker = model loaded once; scale horizontally
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_KEY: ${API_KEY:-}              # set to require X-API-Key on predict routes
    volumes:
      - ./logs:/app/logs
      # Serve the 5-fold ENSEMBLE: ENSEMBLE_DIR points at /app/models/folds,
      # so the API auto-detects the folds and averages them.
      - ./artifacts/training/folds:/app/models/folds:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
