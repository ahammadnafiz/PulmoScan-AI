services:
  api:
    build: .
    container_name: pulmoscan-api
    ports:
      - "8000:8000"
    environment:
      ENV: production
      MODEL_PATH: models/model.pt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_KEY: ${API_KEY:-}
    volumes:
      # Mount the trained checkpoint read-only. Copy artifacts/training/model.pt
      # here, or point this at wherever your model lives.
      - ./models:/app/models:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
