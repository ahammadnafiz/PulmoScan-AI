name: Publish Docker image

# Build the serving image and push it to GitHub Container Registry (GHCR) on
# version tags and published releases. Manual runs (workflow_dispatch) build an
# `edge`/sha-tagged image for testing.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # checkout + download release assets
      packages: write     # push to GHCR
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the repo slug has uppercase.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The trained checkpoint is gitignored (it lives in DVC/Drive), so it's not
      # in the checkout. If the triggering release has a `model.pt` asset, bake it
      # in for a self-contained image; otherwise build a model-less image that
      # expects a model mounted at runtime.
      - name: Bake model from release asset (if present)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release download "$TAG" --pattern 'model.pt' --dir models/ 2>/dev/null; then
            echo "✅ Baked model.pt from release $TAG ($(du -h models/model.pt | cut -f1))"
          else
            echo "⚠️  No model.pt release asset for '$TAG' — building a model-less image."
            echo "    Deploy it with a model mounted at /app/models, e.g.:"
            echo "    docker run -v \$PWD/model.pt:/app/models/model.pt:ro <image>"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto → tag `latest` on the highest non-prerelease semver tag.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
