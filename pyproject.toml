[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoscan"
version = "1.0.0"
description = "PulmoScan AI — production chest CT-scan classifier (PyTorch + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ahammadnafiz", email = "ahammadnafiz86@gmail.com" }]
dependencies = [
    "gdown==5.2.0",
]

[tool.setuptools.packages.find]
include = ["app*", "pulmoscan*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Research notebooks follow exploratory conventions, not module lint rules.
extend-exclude = ["research", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI relies on function calls (File/Query/Depends) in argument defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
